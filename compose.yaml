services:
  postgres:
    image: postgres:16
    container_name: resuelve-postgres-local
    environment:
      POSTGRES_USER: resuelve
      POSTGRES_PASSWORD: resuelve_local
      POSTGRES_DB: resuelve_local
    ports:
      - "5434:5432"
    volumes:
      - resuelve_postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resuelve -d resuelve_local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: resuelve-backend-local
    command: ["sh", "-c", "npm run migration:run && npm run seed && exec npm run start:dev -- --poll"]
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://resuelve:resuelve_local@postgres:5432/resuelve_local
      DATABASE_SSL: "false"
      JWT_ACCESS_SECRET: resuelve-docker-local-access-secret-change-only-for-local
      JWT_REFRESH_SECRET: resuelve-docker-local-refresh-secret-change-only-for-local
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 30d
      FRONTEND_URL: http://localhost:4200
      LOG_LEVEL: info
      EMAIL_VERIFICATION_ENABLED: "false"
      BILLING_PROVIDER: none
    ports:
      - "3000:3000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 12

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: resuelve-frontend-local
    command: ["npm", "start", "--", "--host", "0.0.0.0", "--poll", "1000"]
    ports:
      - "4200:4200"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./angular.json:/app/angular.json:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./tsconfig.app.json:/app/tsconfig.app.json:ro
      - ./.postcssrc.json:/app/.postcssrc.json:ro
      - resuelve_frontend_angular_cache:/app/.angular
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 12

  postgres-test:
    image: postgres:16
    container_name: resuelve-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: resuelve
      POSTGRES_PASSWORD: resuelve_local
      POSTGRES_DB: resuelve_test
    ports:
      - "5433:5432"
    volumes:
      - resuelve_postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resuelve -d resuelve_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  resuelve_postgres_local_data:
  resuelve_frontend_angular_cache:
  resuelve_postgres_test_data:
