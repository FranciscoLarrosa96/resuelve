<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Ícono de Resuelve (casa + tilde). Fuente vectorial de los favicons e íconos de la PWA:
       ver README → "PWA". La versión maskable usa el fondo a sangre y la marca dentro de la zona segura. -->
  <style>
    :root { --brand: #1d4f5c; --mark: #fffdf9; }
  </style>
  <g id="tile">
    <rect width="192" height="192" rx="40" fill="var(--brand)"/>
  </g>
  <g id="mark">
    <!-- chimenea -->
    <rect x="128" y="38" width="20" height="30" rx="4" fill="var(--mark)"/>
    <!-- casa -->
    <path d="M41 140 V88 Q41 80 48 75 L90 45 Q96 41 102 45 L144 75 Q151 80 151 88 V140 Q151 152 139 152 H53 Q41 152 41 140 Z"
      fill="none" stroke="var(--mark)" stroke-width="21" stroke-linejoin="round"/>
    <!-- tilde: contorno oscuro que lo separa de la casa + relleno -->
    <path d="M62 103 L93 128 L151 81" fill="none" stroke="var(--brand)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M62 103 L93 128 L151 81" fill="none" stroke="var(--mark)" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
