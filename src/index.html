<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Resuelve · Profesionales de confianza en tu ciudad</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F3EB">
  <!-- Tema antes de pintar (sin flash): resuelve-theme = light | dark | system. Ver ThemeStore. -->
  <script>
    (function () {
      var t = 'light';
      try { t = localStorage.getItem('resuelve-theme') || 'light'; } catch (e) {}
      var dark = t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#101615');
    })();
  </script>
  <meta name="description" content="Contanos qué pasa y encontrá profesionales que trabajan en tu ciudad.">
  <!-- Datos del sitio para buscadores. Solo lo que es verdad hoy: nombre, URL, logo y ciudad. Sin contacto (no hay casilla oficial). -->
  <script type="application/ld+json">
    {"@context":"https://schema.org","@graph":[
      {"@type":"Organization","@id":"https://resuelve.com.ar/#organization","name":"Resuelve","url":"https://resuelve.com.ar/","logo":"https://resuelve.com.ar/icon-512.png","areaServed":{"@type":"Country","name":"Argentina"}},
      {"@type":"WebSite","@id":"https://resuelve.com.ar/#website","name":"Resuelve","url":"https://resuelve.com.ar/","inLanguage":"es-AR","publisher":{"@id":"https://resuelve.com.ar/#organization"}}
    ]}
  </script>

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <!-- PWA instalable: manifest + service worker de Angular (ngsw-config.json). Ver README → "PWA". -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Resuelve">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
</head>
<body>
  <app-root></app-root>
</body>
</html>
