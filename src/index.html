<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Resuelve · Profesionales de confianza en Tandil</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FBF8F2">
  <!-- Tema antes de pintar (sin flash): resuelve-theme = light | dark | system. Ver ThemeStore. -->
  <script>
    (function () {
      var t = 'system';
      try { t = localStorage.getItem('resuelve-theme') || 'system'; } catch (e) {}
      var dark = t === 'dark' || (t !== 'light' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      if (dark) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#131816');
    })();
  </script>
  <meta name="description" content="Contanos qué pasa y encontrá profesionales en Tandil.">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
</head>
